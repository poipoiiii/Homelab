# lab-tools —— 实验室工具服务（MCP over HTTP）
# 只读查询 + 容器启停（二次确认）+ 下载提交；Docker 访问经由 socket proxy
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  lab-tools:
    build: .
    container_name: lab-tools
    logging: *default-logging
    labels:
      dev.dozzle.group: "AI 助手"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      - TZ=Asia/Shanghai
      - DOCKER_HOST=tcp://docker-proxy:2375
      - DOCKER_HOST_WRITE=tcp://docker-proxy-write:2375
      - BILL_AI_URL=http://rong-ledger:8091
      - METUBE_URL=http://metube:8081
      - AUDIT_PATH=/audit/actions.jsonl
      # B 站搜索复用 MeTube 那份 cookies，只读
      - BILI_COOKIES=/cookies/cookies.txt
      # 下载完成通知（两种后端二选一；都配时优先自建应用，未配置则只写日志）
      # 自建应用：企业 ID + 应用 Secret + AgentId，默认发给应用可见范围内全部成员
      - WECOM_CORP_ID=${WECOM_CORP_ID:-}
      - WECOM_SECRET=${WECOM_SECRET:-}
      - WECOM_AGENT_ID=${WECOM_AGENT_ID:-1000004}
      # 接收人：@all 或 UserID（多个用 | 分隔）；部门/标签可选
      - WECOM_TOUSER=${WECOM_TOUSER:-@all}
      - WECOM_TOPARTY=${WECOM_TOPARTY:-}
      - WECOM_TOTAG=${WECOM_TOTAG:-}
      # 群机器人 webhook（旧方案，可选）
      - WECOM_WEBHOOK=${WECOM_WEBHOOK:-}
    volumes:
      - lab_tools_audit:/audit
      - /home/ubuntu/homelab/metube/cookies.txt:/cookies/cookies.txt:ro
    networks:
      - default
      - bill_ai
      - metube
    depends_on:
      - docker-proxy
      - docker-proxy-write

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: lab-tools-docker-proxy
    logging: *default-logging
    labels:
      dev.dozzle.group: "AI 助手"
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - VERSION=1
      - SYSTEM=1
      - POST=0
      - EXEC=0
      - VOLUMES=0
      - NETWORKS=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default

  # 写代理：不开放 CONTAINERS 查询，只放行 start/stop
  docker-proxy-write:
    image: tecnativa/docker-socket-proxy:latest
    container_name: lab-tools-docker-proxy-write
    logging: *default-logging
    labels:
      dev.dozzle.group: "AI 助手"
    restart: unless-stopped
    environment:
      - CONTAINERS=0
      - ALLOW_START=1
      - ALLOW_STOP=1
      - POST=1
      - EXEC=0
      - VOLUMES=0
      - NETWORKS=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default

networks:
  bill_ai:
    external: true
    name: bill-ai_default
  metube:
    external: true
    name: metube_default

volumes:
  lab_tools_audit:

