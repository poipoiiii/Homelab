# Mosquitto 2 —— 内网 + frp 公网共用 1883 明文端口
# 注意：ESP8266 AT 1.3.0.0 不支持 TLS，因此只能走明文；公网暴露时依赖强密码与 ACL，
# 不要把敏感数据放进 payload。

listener 1883 0.0.0.0
protocol mqtt

# 认证：不允许匿名，账号由 setup.sh 用 mosquitto_passwd 生成
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/aclfile

# 持久化：retained 消息与订阅关系落在命名卷 mqtt_data
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# 设备侧报文很小，限制单包大小，避免被大包打爆
max_packet_size 1024
max_keepalive 120

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
