# Minecraft (Forge / NeoForge) —— 社区最成熟的 itzg 镜像
# 数据放命名卷 mc_data（在 WSL ext4 里，避开 /mnt/d 的 9P 性能坑）
# 复用你现有整合包：见部署说明里的「一次性导入世界/mod」命令
services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc
    restart: unless-stopped
    ports:
      - 25565:25565
    environment:
      EULA: "TRUE"            # 必须接受 Mojang EULA
      TYPE: FORGE             # Forge 整合包；若是 NeoForge 改成 NEOFORGE
      VERSION: "1.20.1"       # 对应整合包 MC 版本（run.bat 确认 forge 1.20.1-47.3.33）
      FORGE_VERSION: "47.3.33"  # 锁定整合包用的 Forge 构建号，避免拉到不同小版本
      MEMORY: 8G              # 对齐当前实际堆 ~7.8G（Java 默认 1/4 物理内存）；WSL 15GiB 上限内留余量
      ONLINE_MODE: "true"     # 正版验证；离线服改 false
    volumes:
      - mc_data:/data
volumes:
  mc_data:
