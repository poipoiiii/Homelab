<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>记账 · Rong的账单</title>
  <link rel="icon" href="/branding/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/branding/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/branding/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css?v=20261022f">
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="brand">
        <img class="brand-mark" src="/branding/logo192.png" alt="" aria-hidden="true">
        <span class="brand-name">Rong的账单</span>
      </div>
      <nav class="dash-nav" aria-label="页面导航">
        <a class="ghost-link is-active" href="/" aria-current="page">记一笔</a>
        <a class="ghost-link" href="/dashboard">总览</a>
        <a class="ghost-link" href="/transactions">流水</a>
        <a class="ghost-link" href="/inbox">待入账</a>
        <a class="ghost-link" href="/settings">设置</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>把截图和账单文件<br>变成可核对的账目</h1>
        <p class="lede">上传或粘贴支付宝、微信截图，或直接放入 CSV / XLSX。模型提取或解析后，你确认再写入本地账本。</p>
      </section>

      <section class="workspace" aria-label="上传截图">
        <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="选择或拖入账单截图">
          <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,.csv,.xlsx,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
          <div class="drop-empty" id="dropEmpty">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 3h9l4 4v14H6z"></path>
              <path d="M14 3v5h5"></path>
              <path d="M9 13h6M9 17h4"></path>
            </svg>
            <strong>拖入截图或账单文件</strong>
            <span>支持 PNG / JPG / 支付宝或微信 CSV / XLSX · 也可 Ctrl+V 粘贴截图</span>
          </div>
          <img id="preview" alt="待识别的账单截图预览" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" hidden>
          <div class="file-chip" id="fileChip" hidden>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 3h9l4 4v14H6z"></path>
              <path d="M14 3v5h5"></path>
              <path d="M9 13h6M9 17h4"></path>
            </svg>
            <div>
              <strong id="fileName"></strong>
              <span id="fileMeta"></span>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="btn primary" id="extractBtn" disabled>识别账单</button>
          <button class="btn secondary" id="clearBtn" hidden>清除</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>

      <section class="results" id="results" hidden aria-label="识别结果">
        <div class="results-head">
          <div>
            <h2 id="resultsTitle">识别结果</h2>
          </div>
          <p class="results-summary" id="resultsSummary"></p>
        </div>
        <div class="rows" id="rows"></div>
        <div class="commit-bar">
          <div class="commit-total">
            <span id="commitCount">0 笔</span>
            <strong id="commitTotal">¥0.00</strong>
          </div>
          <button class="btn primary" id="commitBtn">写入账本</button>
        </div>
      </section>

      <section class="done" id="done" hidden aria-live="polite">
        <div>
          <h2 id="doneTitle">已写入</h2>
          <p id="doneText"></p>
        </div>
        <div class="done-actions">
          <a class="btn secondary on-dark" href="/transactions">查看流水 ↗</a>
          <button class="btn primary" id="againBtn">再记一笔</button>
        </div>
      </section>
    <section class="analysis" id="analysis">
        <div class="analysis-head">
          <div>
            <h2>AI 账单分析</h2>
            <p class="analysis-lede">基于账本里已有的账单，总结结构、风险和可执行的省钱建议。</p>
          </div>
          <div class="analysis-actions">
            <select id="analysisRange" aria-label="分析时间范围">
              <option value="90">近 90 天</option>
              <option value="30">近 30 天</option>
              <option value="month">本月</option>
            </select>
            <button class="btn secondary" id="analyzeBtn">开始分析</button>
          </div>
        </div>
        <p class="status" id="analysisStatus" role="status" aria-live="polite"></p>
        <div class="analysis-result" id="analysisResult" hidden>
          <div class="analysis-stats" id="analysisStats"></div>
          <p class="analysis-summary" id="analysisSummary"></p>
          <p class="analysis-note" id="analysisNote"></p>
          <div class="analysis-grid" id="analysisGrid"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>AI 只做结构化提取，写入前请核对日期、金额与账户。</span>
      <span>本地账本 · 数据留在自己的服务器</span>
    </footer>
  </div>

  <script src="/static/app.js?v=20261022f"></script>
</body>
</html>
